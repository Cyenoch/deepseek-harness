# Electron embeds the Host in its main process. The desktop layer keeps the Web
# client roster while removing browser-server and sidecar lifecycle rows.

- id: directory-picker
  disabled: true

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: modules
  inject: [desktopRuntime]

- id: client-hmr
  inject: [desktopRuntime]
  config:
    transport: electron

- id: connection
  inject: [desktopRuntime]
  config:
    transport: electron

- insert:
    - id: directory-picker-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
