# Unsigned Electron validation plus master-only Windows x64 and macOS arm64
# GitHub Releases. Native targets build on matching runners; package registries
# remain out of scope.
name: Desktop

on:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/cli/**'
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'native/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/cli/**'
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'native/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  workflow_dispatch:

# Push runs are keyed by SHA so a later master push cannot cancel a mid-flight
# release. Pull requests and manual runs still cancel superseded work on the
# same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            builder-args: --mac dmg zip --arm64 --publish never
          - target: windows-x64
            runner: windows-2025
            builder-args: --win nsis msi --x64 --publish never
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify desktop runtime closure
        shell: bash
        run: pnpm exec tsx scripts/verify-runtime-closure.ts --manifest=apps/desktop/package.json

      - name: Build Host, renderer, and Electron entries
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          pnpm --dir apps/desktop run build:code

      - name: Build unsigned Electron artifacts
        shell: bash
        run: pnpm --dir apps/desktop exec electron-builder ${{ matrix.builder-args }}

      - name: Verify artifact set
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm exec tsx scripts/verify-desktop-artifacts.ts --target="$TARGET" apps/desktop/release

      - uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dsh-desktop-macos-arm64
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: dsh-desktop-windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="desktop-v${version}-g${GITHUB_SHA}"
          title="DeepSeek Harness Desktop v${version} (${GITHUB_SHA:0:12})"
          cd release
          assets=(
            "DeepSeek Harness-${version}-mac-arm64.dmg"
            "DeepSeek Harness-${version}-mac-arm64.zip"
            "DeepSeek Harness-${version}-win-x64.exe"
            "DeepSeek Harness-${version}-win-x64.msi"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "${asset}" ]]; then
              echo "::error::missing or empty ${asset}"
              exit 1
            fi
          done
          sha256sum "${assets[@]}" | sort -k2 > SHA256SUMS
          release_state="$(
            gh release view "${tag}" \
              --json isDraft \
              --jq 'if .isDraft then "draft" else "published" end' \
              2>/dev/null || printf 'missing'
          )"
          if [[ "${release_state}" == "published" ]]; then
            exit 0
          fi
          if [[ "${release_state}" == "missing" ]]; then
            prerelease_args=()
            if [[ "${version}" == *-* ]]; then
              prerelease_args=(--prerelease)
            fi
            gh release create "${tag}" \
              --draft \
              --title "${title}" \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              "${prerelease_args[@]}"
          elif [[ "${release_state}" != "draft" ]]; then
            echo "::error::unexpected release state ${release_state}"
            exit 1
          fi
          gh release upload "${tag}" "${assets[@]}" SHA256SUMS --clobber
          gh release edit "${tag}" --draft=false
